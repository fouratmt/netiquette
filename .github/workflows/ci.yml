name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Set up just
        uses: extractions/setup-just@v4
        with:
          just-version: 1.46.0

      - name: Install dependencies
        run: just install

      - name: Audit production dependencies
        run: just audit

      - name: Verify project
        run: just verify

      - name: Build and validate Pages site
        run: just pages-check "/${{ github.event.repository.name }}/"

      - name: Install Chromium
        run: just install-browser-ci chromium

      - name: Run browser and accessibility flows
        run: just e2e

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build production container
        run: docker build --tag netiquette:ci .

      - name: Smoke test production container
        run: |
          docker run --detach --name netiquette-ci --publish 8080:8080 netiquette:ci
          trap 'docker logs netiquette-ci; docker rm --force netiquette-ci' EXIT
          curl --fail --retry 10 --retry-all-errors --retry-delay 1 --max-time 5 http://127.0.0.1:8080/healthz
          curl --fail --silent --location --output /tmp/netiquette-ci.html http://127.0.0.1:8080/en
          grep -q 'id="app"' /tmp/netiquette-ci.html
